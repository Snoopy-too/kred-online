  <script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const BOARD_IMAGES = {
  3: '../public/images/3player_board.jpg',
  4: '../public/images/4player_board.png',
  5: '../public/images/5player_board.jpg'
};

const PIECE_IMAGE = '../public/images/mark-transparent_bg.png';
const TILE_IMAGE = '../public/images/01.svg';

const SCALE_MULTIPLIERS = {
  3: 0.85,
  4: 1,
  5: 0.9
};
const BASE_SCALE = 0.798;

function App() {
  const [playerCount, setPlayerCount] = useState(4);
  
  // State for coordinates
  const loadSavedState = (count, key, defaultData) => {
    const saved = localStorage.getItem(`kred_diag_${count}_${key}`);
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData));
  };

  const [dropLocations, setDropLocations] = useState(() => loadSavedState(4, 'dropLocations', window.FOUR_PLAYER_DROP_LOCATIONS));
  const [tileSpaces, setTileSpaces] = useState(() => loadSavedState(4, 'tileSpaces', window.TILE_SPACES_BY_PLAYER_COUNT[4]));
  const [bankSpaces, setBankSpaces] = useState(() => loadSavedState(4, 'bankSpaces', window.BANK_SPACES_BY_PLAYER_COUNT[4]));
  const [credibilitySpaces, setCredibilitySpaces] = useState(() => loadSavedState(4, 'credibilitySpaces', window.CREDIBILITY_LOCATIONS_BY_PLAYER_COUNT[4]));

  // Diagnostic states
  const [diagPiece, setDiagPiece] = useState({ left: 50, top: 50 });
  const [diagTile, setDiagTile] = useState({ left: 50, top: 50, rotation: 0 });
  const [dragging, setDragging] = useState(null); // 'piece' or 'tile'

  const boardRef = useRef(null);

  // Switch player count
  useEffect(() => {
    let drops = [];
    if (playerCount === 3) drops = window.THREE_PLAYER_DROP_LOCATIONS;
    else if (playerCount === 4) drops = window.FOUR_PLAYER_DROP_LOCATIONS;
    else if (playerCount === 5) drops = window.FIVE_PLAYER_DROP_LOCATIONS;
    
    setDropLocations(loadSavedState(playerCount, 'dropLocations', drops));
    setTileSpaces(loadSavedState(playerCount, 'tileSpaces', window.TILE_SPACES_BY_PLAYER_COUNT[playerCount] || []));
    setBankSpaces(loadSavedState(playerCount, 'bankSpaces', window.BANK_SPACES_BY_PLAYER_COUNT[playerCount] || []));
    setCredibilitySpaces(loadSavedState(playerCount, 'credibilitySpaces', window.CREDIBILITY_LOCATIONS_BY_PLAYER_COUNT[playerCount] || []));
  }, [playerCount]);

  // Auto-save changes
  useEffect(() => {
    localStorage.setItem(`kred_diag_${playerCount}_dropLocations`, JSON.stringify(dropLocations));
    localStorage.setItem(`kred_diag_${playerCount}_tileSpaces`, JSON.stringify(tileSpaces));
    localStorage.setItem(`kred_diag_${playerCount}_bankSpaces`, JSON.stringify(bankSpaces));
    localStorage.setItem(`kred_diag_${playerCount}_credibilitySpaces`, JSON.stringify(credibilitySpaces));
  }, [playerCount, dropLocations, tileSpaces, bankSpaces, credibilitySpaces]);

  const resetToDefaults = () => {
    if (confirm(`Are you sure you want to reset all unsaved changes for the ${playerCount}-player board back to the game defaults?`)) {
      localStorage.removeItem(`kred_diag_${playerCount}_dropLocations`);
      localStorage.removeItem(`kred_diag_${playerCount}_tileSpaces`);
      localStorage.removeItem(`kred_diag_${playerCount}_bankSpaces`);
      localStorage.removeItem(`kred_diag_${playerCount}_credibilitySpaces`);
      
      let drops = [];
      if (playerCount === 3) drops = window.THREE_PLAYER_DROP_LOCATIONS;
      else if (playerCount === 4) drops = window.FOUR_PLAYER_DROP_LOCATIONS;
      else if (playerCount === 5) drops = window.FIVE_PLAYER_DROP_LOCATIONS;
      
      setDropLocations(JSON.parse(JSON.stringify(drops)));
      setTileSpaces(JSON.parse(JSON.stringify(window.TILE_SPACES_BY_PLAYER_COUNT[playerCount] || [])));
      setBankSpaces(JSON.parse(JSON.stringify(window.BANK_SPACES_BY_PLAYER_COUNT[playerCount] || [])));
      setCredibilitySpaces(JSON.parse(JSON.stringify(window.CREDIBILITY_LOCATIONS_BY_PLAYER_COUNT[playerCount] || [])));
    }
  };

  const handlePointerDown = (e, type) => {
    e.preventDefault();
    setDragging(type);
  };

  const handlePointerMove = (e) => {
    if (!dragging || !boardRef.current) return;
    
    const rect = boardRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

    if (dragging === 'piece') {
      setDiagPiece({ left: x, top: y });
    } else if (dragging === 'tile') {
      setDiagTile(prev => ({ ...prev, left: x, top: y }));
    }
  };

  const handlePointerUp = () => {
    setDragging(null);
  };

  useEffect(() => {
    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);
    return () => {
      window.removeEventListener('pointermove', handlePointerMove);
      window.removeEventListener('pointerup', handlePointerUp);
    };
  }, [dragging]);

  // Exporter
  const exportMD = () => {
    let md = `# Coordinates for ${playerCount}-Player Mode\n\n`;
    
    md += `## Drop Locations (Pieces)\n`;
    md += `| ID | Left (%) | Top (%) |\n|---|---|---|\n`;
    dropLocations.forEach(loc => {
      md += `| ${loc.id} | ${loc.position.left.toFixed(2)} | ${loc.position.top.toFixed(2)} |\n`;
    });

    md += `\n## Tile Spaces (Receiving)\n`;
    md += `| Owner ID | Left (%) | Top (%) | Rotation (deg) |\n|---|---|---|---|\n`;
    tileSpaces.forEach(space => {
      md += `| Player ${space.ownerId} | ${space.position.left.toFixed(2)} | ${space.position.top.toFixed(2)} | ${space.rotation} |\n`;
    });

    md += `\n## Credibility Locations\n`;
    md += `| Owner ID | Left (%) | Top (%) | Rotation (deg) |\n|---|---|---|---|\n`;
    credibilitySpaces.forEach(space => {
      md += `| Player ${space.ownerId} | ${space.position.left.toFixed(2)} | ${space.position.top.toFixed(2)} | ${space.rotation} |\n`;
    });

    md += `\n## Bank Spaces\n`;
    md += `| Owner ID | Left (%) | Top (%) | Rotation (deg) |\n|---|---|---|---|\n`;
    bankSpaces.forEach(space => {
      md += `| Player ${space.ownerId} | ${space.position.left.toFixed(2)} | ${space.position.top.toFixed(2)} | ${space.rotation} |\n`;
    });

    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `coordinates_${playerCount}p.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const updateDropLocation = (index, field, value) => {
    const val = parseFloat(value);
    if (isNaN(val)) return;
    const newLocs = [...dropLocations];
    newLocs[index].position[field] = val;
    setDropLocations(newLocs);
  };

  const updateTileSpace = (listName, index, field, value) => {
    const val = parseFloat(value);
    if (isNaN(val)) return;
    if (listName === 'tileSpaces') {
      const newSpaces = [...tileSpaces];
      if (field === 'rotation') newSpaces[index].rotation = val;
      else newSpaces[index].position[field] = val;
      setTileSpaces(newSpaces);
    } else {
      const newSpaces = [...bankSpaces];
      if (field === 'rotation') newSpaces[index].rotation = val;
      else newSpaces[index].position[field] = val;
      setBankSpaces(newSpaces);
    }
  };

  const updateCredibilitySpace = (index, field, value) => {
    const val = parseFloat(value);
    if (isNaN(val)) return;
    const newSpaces = [...credibilitySpaces];
    if (field === 'rotation') newSpaces[index].rotation = val;
    else newSpaces[index].position[field] = val;
    setCredibilitySpaces(newSpaces);
  };

  const finalScale = BASE_SCALE * SCALE_MULTIPLIERS[playerCount];

  return (
    <div className="flex h-screen flex-col bg-slate-900 text-slate-100 font-sans">
      {/* Header */}
      <header className="flex-none p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center z-10 shadow-md">
        <div className="flex items-center gap-4">
          <h1 className="text-xl font-bold text-cyan-400">Location Diagnostics</h1>
          <select 
            className="bg-slate-700 border border-slate-600 rounded px-3 py-1 text-white"
            value={playerCount}
            onChange={(e) => setPlayerCount(parseInt(e.target.value))}
          >
            <option value={3}>3 Players</option>
            <option value={4}>4 Players</option>
            <option value={5}>5 Players</option>
          </select>
        </div>
        
        <div className="flex items-center gap-6">
          <div className="flex flex-col text-sm bg-slate-700 px-4 py-2 rounded shadow-inner">
            <span className="text-cyan-300 font-bold">Diagnostic Piece (Mark)</span>
            <span>X: {diagPiece.left.toFixed(2)}% | Y: {diagPiece.top.toFixed(2)}%</span>
          </div>
          <div className="flex flex-col text-sm bg-slate-700 px-4 py-2 rounded shadow-inner">
            <span className="text-pink-300 font-bold">Diagnostic Tile</span>
            <span>X: {diagTile.left.toFixed(2)}% | Y: {diagTile.top.toFixed(2)}% | Rot: {diagTile.rotation}°</span>
            <input 
              type="range" min="0" max="360" value={diagTile.rotation} 
              onChange={e => setDiagTile(prev => ({...prev, rotation: parseInt(e.target.value)}))}
              className="mt-1"
            />
          </div>
          <div className="flex gap-2">
            <button 
              onClick={resetToDefaults}
              className="bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded transition-colors shadow-lg text-sm"
            >
              Reset to Game Defaults
            </button>
            <button 
              onClick={exportMD}
              className="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded transition-colors shadow-lg"
            >
              Export MD
            </button>
          </div>
        </div>
      </header>

      {/* Main Layout */}
      <div className="flex-1 flex overflow-hidden">
        {/* Left: Board Area */}
        <div className="flex-1 bg-gray-600 flex items-center justify-center p-4 overflow-auto relative">
          
          {/* Board Container */}
          <div 
            ref={boardRef}
            className="w-full max-w-5xl aspect-[1/1] relative bg-slate-800 shadow-2xl"
          >
            <img 
              src={BOARD_IMAGES[playerCount]} 
              className="w-full h-full object-contain absolute inset-0 pointer-events-none" 
            />
            
            {/* Grid Lines for reference */}
            <div className="absolute inset-0 pointer-events-none opacity-20"
                 style={{
                   backgroundImage: `linear-gradient(to right, white 1px, transparent 1px), linear-gradient(to bottom, white 1px, transparent 1px)`,
                   backgroundSize: "2% 2%"
                 }}
            />

            {/* Render Drop Location Markers (Pieces) */}
            {dropLocations.map((loc, i) => (
              <div key={`drop-${i}`} className="absolute w-2 h-2 bg-yellow-400 rounded-full -ml-1 -mt-1 shadow hover:scale-150 transition-transform cursor-crosshair z-10"
                   style={{ left: `${loc.position.left}%`, top: `${loc.position.top}%` }}
                   title={`${loc.id} (${loc.position.left}, ${loc.position.top})`} />
            ))}

            {/* Render Tile Spaces */}
            {tileSpaces.map((space, i) => (
              <div key={`tspace-${i}`} className="absolute border border-cyan-400/50 bg-cyan-400/20 rounded z-10 flex items-center justify-center text-xs text-white"
                   style={{ width: '4.6875%', height: '9.375%',
                     left: `${space.position.left}%`, top: `${space.position.top}%`, 
                     transform: `translate(-50%, -50%) rotate(${space.rotation}deg)` 
                   }}
                   title={`Tile Space P${space.ownerId}`}>
                T{space.ownerId}
              </div>
            ))}

            {/* Render Bank Spaces */}
            {bankSpaces.map((space, i) => (
              <div key={`bspace-${i}`} className="absolute border border-pink-400/50 bg-pink-400/20 rounded z-10 flex items-center justify-center text-xs text-white"
                   style={{ width: '4.6875%', height: '9.375%',
                     left: `${space.position.left}%`, top: `${space.position.top}%`, 
                     transform: `translate(-50%, -50%) rotate(${space.rotation}deg)` 
                   }}
                   title={`Bank Space P${space.ownerId}`}>
                B{space.ownerId}
              </div>
            ))}

            
            {/* Render Credibility Spaces */}
            {credibilitySpaces.map((space, i) => (
              <div key={`cred-${i}`} className="absolute rounded-full border-2 border-emerald-400 bg-emerald-400/30 z-20 flex items-center justify-center text-xs text-white font-bold"
                   style={{ width: '4%', height: '4%',
                     left: `${space.position.left}%`, top: `${space.position.top}%`, 
                     transform: `translate(-50%, -50%) rotate(${space.rotation}deg)` 
                   }}
                   title={`Credibility P${space.ownerId}`}>
                C${space.ownerId}
              </div>
            ))}

            {/* Diagnostic Tile */}
            <div 
              onPointerDown={e => handlePointerDown(e, 'tile')}
              className="absolute rounded-lg shadow-2xl cursor-grab z-40 transition-transform hover:scale-105"
              style={{ width: '4.6875%', height: '9.375%',
                left: `${diagTile.left}%`, 
                top: `${diagTile.top}%`,
                transform: `translate(-50%, -50%) rotate(${diagTile.rotation}deg)`
              }}
            >
              <img src={TILE_IMAGE} className="w-full h-full object-contain pointer-events-none" />
            </div>

            {/* Diagnostic Piece */}
            <div 
              onPointerDown={e => handlePointerDown(e, 'piece')}
              className="absolute cursor-grab z-50 transition-transform hover:brightness-125"
              style={{ width: '5.46875%', height: '5.46875%',
                left: `${diagPiece.left}%`, 
                top: `${diagPiece.top}%`,
                transform: `translate(-50%, -50%) scale(${finalScale})`,
                filter: "drop-shadow(0 0 8px rgba(0,0,0,0.5))"
              }}
            >
              <img src={PIECE_IMAGE} className="w-full h-full object-contain pointer-events-none" />
            </div>

          </div>
        </div>

        {/* Right: Sidebar Editor */}
        <div className="w-[450px] bg-slate-800 border-l border-slate-700 flex flex-col shadow-2xl z-20">
          
          <div className="flex-1 overflow-auto p-4 custom-scrollbar">
            <h2 className="text-lg font-bold text-cyan-300 mb-4 sticky top-0 bg-slate-800 py-2">Piece Drop Locations</h2>
            
            <div className="grid grid-cols-[2fr_1fr_1fr] gap-2 font-bold text-xs text-slate-400 mb-2 px-1">
              <div>LOCATION ID</div>
              <div>X (%)</div>
              <div>Y (%)</div>
            </div>
            
            <div className="space-y-1 mb-8">
              {dropLocations.map((loc, i) => (
                <div key={i} className="grid grid-cols-[2fr_1fr_1fr] gap-2 items-center bg-slate-700/50 p-1 rounded hover:bg-slate-700">
                  <span className="text-xs font-mono truncate px-1" title={loc.id}>{loc.id}</span>
                  <input type="number" step="0.1" value={loc.position.left} 
                         onChange={e => updateDropLocation(i, 'left', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-cyan-500 outline-none" />
                  <input type="number" step="0.1" value={loc.position.top} 
                         onChange={e => updateDropLocation(i, 'top', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-cyan-500 outline-none" />
                </div>
              ))}
            </div>

            <h2 className="text-lg font-bold text-pink-300 mb-4 sticky top-0 bg-slate-800 py-2">Tile Drop Locations</h2>
            
            <div className="grid grid-cols-[1fr_1fr_1fr_1fr] gap-2 font-bold text-xs text-slate-400 mb-2 px-1">
              <div>OWNER/TYPE</div>
              <div>X (%)</div>
              <div>Y (%)</div>
              <div>ROT (°)</div>
            </div>

            <div className="space-y-1 mb-4">
              <div className="text-xs font-bold text-slate-500 mb-1 mt-4">Tile Spaces (Receiving)</div>
              {tileSpaces.map((space, i) => (
                <div key={`ts-${i}`} className="grid grid-cols-[1fr_1fr_1fr_1fr] gap-2 items-center bg-slate-700/50 p-1 rounded hover:bg-slate-700">
                  <span className="text-xs font-mono px-1">P{space.ownerId} Space</span>
                  <input type="number" step="0.1" value={space.position.left} 
                         onChange={e => updateTileSpace('tileSpaces', i, 'left', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-cyan-500 outline-none" />
                  <input type="number" step="0.1" value={space.position.top} 
                         onChange={e => updateTileSpace('tileSpaces', i, 'top', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-cyan-500 outline-none" />
                  <input type="number" step="0.1" value={space.rotation} 
                         onChange={e => updateTileSpace('tileSpaces', i, 'rotation', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-cyan-500 outline-none" />
                </div>
              ))}
              
              
              <div className="text-xs font-bold text-slate-500 mb-1 mt-4">Credibility Tokens</div>
              {credibilitySpaces.map((space, i) => (
                <div key={`cred-${i}`} className="grid grid-cols-[1fr_1fr_1fr_1fr] gap-2 items-center bg-slate-700/50 p-1 rounded hover:bg-slate-700 border-l-2 border-emerald-400">
                  <span className="text-xs font-mono px-1">P{space.ownerId} Cred</span>
                  <input type="number" step="0.1" value={space.position.left} 
                         onChange={e => updateCredibilitySpace(i, 'left', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-emerald-500 outline-none" />
                  <input type="number" step="0.1" value={space.position.top} 
                         onChange={e => updateCredibilitySpace(i, 'top', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-emerald-500 outline-none" />
                  <input type="number" step="0.1" value={space.rotation} 
                         onChange={e => updateCredibilitySpace(i, 'rotation', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-emerald-500 outline-none" />
                </div>
              ))}

              <div className="text-xs font-bold text-slate-500 mb-1 mt-4">Bank Spaces</div>
              {bankSpaces.map((space, i) => (
                <div key={`bs-${i}`} className="grid grid-cols-[1fr_1fr_1fr_1fr] gap-2 items-center bg-slate-700/50 p-1 rounded hover:bg-slate-700">
                  <span className="text-xs font-mono px-1">P{space.ownerId} Bank</span>
                  <input type="number" step="0.1" value={space.position.left} 
                         onChange={e => updateTileSpace('bankSpaces', i, 'left', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-cyan-500 outline-none" />
                  <input type="number" step="0.1" value={space.position.top} 
                         onChange={e => updateTileSpace('bankSpaces', i, 'top', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-cyan-500 outline-none" />
                  <input type="number" step="0.1" value={space.rotation} 
                         onChange={e => updateTileSpace('bankSpaces', i, 'rotation', e.target.value)}
                         className="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs text-white focus:border-cyan-500 outline-none" />
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
      <style>{`
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
